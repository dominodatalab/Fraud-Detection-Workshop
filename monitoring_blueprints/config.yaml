  datasource_name: ''
  datasource_type: s3
  drift_features:
  - num__Amount
  - num__risk_score
  - num__MerchantRisk
  - num__amount_vs_avg30d_ratio
  - num__DistFromHome
  drift_algorithm: POPULATION STABILITY INDEX
  psi_threshold: 0.2
  prediction_path: monitoring/prediction_data/
  ground_truth_path: monitoring/ground_truth_batches/
traffic:
  requests_per_run: 100
  drift_switch_after_run: 8
  maturation_window_hours: 6
  scoring_log_subdir: monitoring
jobs:
  load_generator_command: python monitoring_blueprints/creditfraud_load_generator.py
  load_generator_cron: 0 0/15 * * * ?
  ground_truth_command: python monitoring_blueprints/creditfraud_ground_truth.py
  ground_truth_cron: 0 0 0/2 * * ?
  ensure_drift_scheduled_command: python monitoring_blueprints/scripts/ensure_drift_scheduled.py
  ensure_drift_scheduled_cron: 0 0/10 * * * ?
  timezone: America/New_York
  git_ref: main
